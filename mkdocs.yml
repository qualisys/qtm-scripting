INHERIT: .venv/Lib/site-packages/qualisys_mkdocs_theme/base.yml

site_name: QTM Scripting Interface

theme:
  custom_dir: .venv/Lib/site-packages/qualisys_mkdocs_theme/assets

nav:
  - Home: index.md
  - Modules: modules.md
  - Types: types.md
  - Changelog: changelog.md

# INHERIT replaces (not merges) the parent's plugin list. The
# inherited plugins from base.yml are repeated here; markdownextradata
# and print-site are omitted: the former mis-parses `{{ ... }}`
# content in the generated API pages, the latter is for PDF export
# which QSI doesn't use.
plugins:
  - search
  - offline
  - autorefs: {}

hooks:
  - hooks/exclude_modules_from_search.py

copyright: |
  Copyright 2026 Qualisys AB

extra:
  version:
    provider: mike
